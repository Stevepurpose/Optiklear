[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "optiklear"
version = "0.1.0"
description = "A Python library for mathematical operations and image processing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[tool.hatch.build.targets.wheel]
packages = ["optiklear"]